<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        table {
            margin: 100px auto;
            border-collapse: collapse;
            background-color: #ffffff;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        th {
            padding: 15px;
            background-color: #4CAF50;
            color: white;
            font-size: 18px;
        }

        td {
            padding: 10px;
        }

        input[type="text"],
        input[type="password"] {
            width: 95%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }

        input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <form>
        <table>
            <tr>
                <th colspan="2">Login</th>
            </tr>
            <tr>
                <td>Username</td>
                <td><input type="text" placeholder="Enter username"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" placeholder="Enter password"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
